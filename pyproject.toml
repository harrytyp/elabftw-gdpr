[project]
name = "elabftw-gdpr"
version = "1.0.0"
description = "eLabFTW GDPR Art.15 — two 1-click pipelines: API (elab-gdpr) and DB full (elab-gdpr-db)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "elabapy>=1.1.0",
    "requests>=2.28",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
detect = ["questionary>=2.0", "rich>=13.0"]

[project.scripts]
elab-gdpr = "gdpr:main"
elab-gdpr-db = "gdpr_db_full:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "gdpr",
    "gdpr_db_full",
]
packages = ["scripts"]
