[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elabftw-gdpr"
version = "0.1.0"
description = "GDPR Art. 15 data subject access request tooling for eLabFTW (sysadmin API key + minimal DB part)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["elabftw", "gdpr", "dsgvo", "data-subject-access-request", "datenschutz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Security",
]
dependencies = [
    "elabapy>=1.1.0",   # official eLabFTW API wrapper (pulls in requests)
    "pillow>=10.0",     # thumbnails for the HTML explorer
    "reportlab>=4.0",   # PDF disclosure letter
]

[project.scripts]
gdpr-export = "elabftw_gdpr.export:main"
gdpr-report = "elabftw_gdpr.report:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["elabftw_gdpr"]
